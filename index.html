<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f7d4d" />
    <title>Florida Quantum Computing</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/fqc-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg aria-hidden="true" class="icon-sprite" xmlns="http://www.w3.org/2000/svg">
      <symbol id="icon-home" viewBox="0 0 24 24">
        <path d="M3 10.6 12 3l9 7.6v9.1a1.3 1.3 0 0 1-1.3 1.3h-5.2v-6.1h-5V21H4.3A1.3 1.3 0 0 1 3 19.7z" />
      </symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24">
        <path d="M7 3v3M17 3v3M4.5 9h15M6 5h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" />
      </symbol>
      <symbol id="icon-map" viewBox="0 0 24 24">
        <path d="m9 18-5 2V6l5-2 6 2 5-2v14l-5 2zM9 4v14M15 6v14" />
      </symbol>
      <symbol id="icon-lock" viewBox="0 0 24 24">
        <path d="M7 10V8a5 5 0 0 1 10 0v2M6 10h12v10H6z" />
      </symbol>
      <symbol id="icon-user" viewBox="0 0 24 24">
        <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0" />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="m5 12 4 4L19 6" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="icon-dollar" viewBox="0 0 24 24">
        <path d="M12 2v20M17 7.5c-1-1-2.4-1.5-4.1-1.5-2.5 0-4.1 1.1-4.1 2.9 0 4.2 8.5 2 8.5 6.5 0 1.7-1.7 2.9-4.5 2.9-2 0-3.8-.7-5-1.8" />
      </symbol>
    </svg>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand-title">
          <img src="./assets/fqc-logo.svg" alt="" />
          <div>
            <p class="eyebrow">Florida Quantum Computing</p>
            <h1 id="screen-title">Home</h1>
          </div>
        </div>
        <button class="profile-chip" id="quick-profile" type="button" aria-label="Open profile">
          <span id="profile-initial">F</span>
        </button>
      </header>

      <main id="app" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="Primary">
        <button class="nav-item active" type="button" data-view="home" aria-current="page">
          <svg><use href="#icon-home"></use></svg>
          <span>Home</span>
        </button>
        <button class="nav-item" type="button" data-view="calendar">
          <svg><use href="#icon-calendar"></use></svg>
          <span>Calendar</span>
        </button>
        <button class="nav-item" type="button" data-view="map">
          <svg><use href="#icon-map"></use></svg>
          <span>Map</span>
        </button>
        <button class="nav-item" type="button" data-view="officers">
          <svg><use href="#icon-lock"></use></svg>
          <span>Officers</span>
        </button>
        <button class="nav-item" type="button" data-view="profile">
          <svg><use href="#icon-user"></use></svg>
          <span>Profile</span>
        </button>
      </nav>
    </div>

    <template id="metric-template">
      <article class="metric-card">
        <strong></strong>
        <span></span>
      </article>
    </template>

    <script src="./app.js" type="module"></script>
  </body>
</html>
