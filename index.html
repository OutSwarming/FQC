<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FQC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Florida Quantum Computing</title>
    <meta name="description" content="Meet Florida Quantum Computing at UF. Explore our workshops, meet the community, and find your next event." />
    <link rel="manifest" href="/manifest.webmanifest?v=29" />
    <link rel="icon" href="/assets/fqc-app-icon-192.png?v=29" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/fqc-app-icon-180.png?v=29" />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      try {
        const savedTheme = localStorage.getItem("fqc:theme");
        const systemTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = ["light", "dark"].includes(savedTheme) ? savedTheme : systemTheme;
      } catch {}
    </script>
    <style>
      /* Critical splash styles, inlined so the first-load screen is fully styled
         from the very first paint — never a flash of unstyled markup, and never
         dependent on the external stylesheet or the service-worker cache. */
      :root {
        --splash-bg: #f2f2f7;
        --splash-ink: #1c1c1e;
        --splash-muted: #636366;
        --splash-accent: #007aff;
        --splash-accent-strong: #0066d6;
        --splash-shadow: 0 18px 50px rgba(28, 48, 88, 0.12);
      }
      :root[data-theme="dark"] {
        --splash-bg: #000000;
        --splash-ink: #f5f5f7;
        --splash-muted: #aeaeb2;
        --splash-accent: #0a84ff;
        --splash-accent-strong: #409cff;
        --splash-shadow: 0 22px 60px rgba(0, 0, 0, 0.38);
      }
      body.splash-active { overflow: hidden; }
      .app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147482000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        padding: 32px;
        background:
          radial-gradient(125% 90% at 50% 16%, color-mix(in srgb, var(--splash-accent) 18%, transparent) 0%, transparent 62%),
          var(--splash-bg);
        color: var(--splash-ink);
        opacity: 1;
        transition: opacity 520ms ease, visibility 520ms ease;
        animation: splash-failsafe 0s linear 8s forwards;
      }
      .app-splash.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .app-splash__stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
        animation: splash-rise 620ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .app-splash__logo { position: relative; display: grid; place-items: center; width: 132px; height: 132px; }
      .app-splash__logo img {
        width: 92px;
        height: 92px;
        border-radius: 24px;
        box-shadow: var(--splash-shadow), 0 0 46px color-mix(in srgb, var(--splash-accent) 36%, transparent);
        animation: splash-pulse 2.4s ease-in-out infinite;
      }
      .app-splash__ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: var(--splash-accent);
        border-right-color: color-mix(in srgb, var(--splash-accent) 45%, transparent);
        animation: splash-spin 1.15s linear infinite;
      }
      .app-splash__ring--inner {
        inset: 15px;
        border-top-color: transparent;
        border-right-color: transparent;
        border-bottom-color: color-mix(in srgb, var(--splash-accent-strong) 62%, transparent);
        border-left-color: color-mix(in srgb, var(--splash-accent-strong) 28%, transparent);
        animation-duration: 1.75s;
        animation-direction: reverse;
      }
      .app-splash__wordmark {
        max-width: 15ch;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: clamp(1.08rem, 4.6vw, 1.42rem);
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: 0.01em;
        text-align: center;
        color: var(--splash-ink);
      }
      .app-splash__progress {
        position: relative;
        width: min(240px, 62vw);
        height: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: color-mix(in srgb, var(--splash-ink) 12%, transparent);
      }
      .app-splash__progress > span {
        position: absolute;
        inset: 0;
        left: 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, var(--splash-accent), var(--splash-accent-strong), transparent);
        animation: splash-slide 1.25s ease-in-out infinite;
      }
      .app-splash__status {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 0.82rem;
        letter-spacing: 0.04em;
        color: var(--splash-muted);
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
      @keyframes splash-slide { 0% { transform: translateX(-125%); } 100% { transform: translateX(320%); } }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes splash-failsafe { to { opacity: 0; visibility: hidden; pointer-events: none; } }
      @media (prefers-reduced-motion: reduce) {
        .app-splash,
        .app-splash__stage,
        .app-splash__logo img,
        .app-splash__ring,
        .app-splash__progress > span { animation: none !important; }
        .app-splash__progress > span { width: 100%; left: 0; }
      }
    </style>
  </head>
  <body class="splash-active">
    <div id="app-splash" class="app-splash" role="status" aria-live="polite" aria-label="Loading Florida Quantum Computing">
      <div class="app-splash__stage">
        <span class="app-splash__logo">
          <span class="app-splash__ring" aria-hidden="true"></span>
          <span class="app-splash__ring app-splash__ring--inner" aria-hidden="true"></span>
          <img src="/assets/fqc-app-icon-192.png?v=29" width="92" height="92" alt="Florida Quantum Computing" />
        </span>
        <span class="app-splash__wordmark">Florida Quantum Computing</span>
        <span class="app-splash__progress" aria-hidden="true"><span></span></span>
      </div>
      <span class="app-splash__status">Loading your events&hellip;</span>
    </div>

    <svg aria-hidden="true" class="icon-sprite" xmlns="http://www.w3.org/2000/svg">

        <path d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6Z" />
      </symbol>
      <symbol id="icon-home" viewBox="0 0 24 24">

      </symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24">
        <path d="M7 3v3M17 3v3M4.5 9h15M6 5h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" />
      </symbol>
      <symbol id="icon-map" viewBox="0 0 24 24">
        <path d="m9 18-5 2V6l5-2 6 2 5-2v14l-5 2zM9 4v14M15 6v14" />
      </symbol>
      <symbol id="icon-lock" viewBox="0 0 24 24">
        <path d="M7 10V8a5 5 0 0 1 10 0v2M6 10h12v10H6z" />
      </symbol>
      <symbol id="icon-user" viewBox="0 0 24 24">
        <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0" />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="m5 12 4 4L19 6" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.55 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 8.55a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.45 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.16.37.37.7.6 1 .3.28.68.42 1.1.4h.1v4h-.1A1.7 1.7 0 0 0 19.4 15Z" />
      </symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41" />
      </symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24">
        <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2z" />
      </symbol>
      <symbol id="icon-location" viewBox="0 0 24 24">
        <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
        <circle cx="12" cy="10" r="2.5" />
      </symbol>
      <symbol id="icon-chevron-left" viewBox="0 0 24 24">
        <path d="m15 18-6-6 6-6" />
      </symbol>
      <symbol id="icon-chevron-right" viewBox="0 0 24 24">
        <path d="m9 18 6-6-6-6" />
      </symbol>
      <symbol id="icon-dollar" viewBox="0 0 24 24">
        <path d="M12 2v20M17 7.5c-1-1-2.4-1.5-4.1-1.5-2.5 0-4.1 1.1-4.1 2.9 0 4.2 8.5 2 8.5 6.5 0 1.7-1.7 2.9-4.5 2.9-2 0-3.8-.7-5-1.8" />
      </symbol>
      <symbol id="icon-file" viewBox="0 0 24 24">
        <path d="M6 2h8l4 4v16H6zM14 2v5h4M9 12h6M9 16h6" />
      </symbol>
      <symbol id="icon-mail" viewBox="0 0 24 24">
        <path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" />
        <path d="m3.5 6.5 8.5 6 8.5-6" />
      </symbol>
    </svg>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand-title">
          <span class="brand-mark">
            <span class="brand-mark-fallback" aria-hidden="true">FQC</span>
            <img src="/assets/fqc-app-icon-192.png?v=29" alt="Florida Quantum Computing logo" />
          </span>
          <div>
            <p class="eyebrow">Florida Quantum Computing</p>
            <h1 id="screen-title">Events</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="header-settings" id="settings-toggle" type="button" aria-label="Open settings"><svg aria-hidden="true"><use href="#icon-settings"></use></svg><span>Settings</span></button>
        </div>
      </header>

      <main id="app" tabindex="-1"></main>
    </div>

    <!-- The shared dock is outside each screen's sizing and clipping context. -->
    <nav class="bottom-nav" aria-label="Primary">
      <span class="nav-glass-lens" aria-hidden="true"></span>
      <button class="nav-item" type="button" data-view="about">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6"></path><path d="M12 7h.01"></path></svg>
        <span>About</span>
      </button>
      <button class="nav-item active" type="button" data-view="home" aria-current="page">
        <svg><use href="#icon-calendar"></use></svg>
        <span>Events</span>
      </button>
      <button class="nav-item" type="button" data-view="hackathon">
        <svg><use href="#icon-spark"></use></svg>
        <span>Hackathon</span>
      </button>
      <button class="nav-item" type="button" data-view="profile">
        <svg><use href="#icon-user"></use></svg>
        <span>Profile</span>
      </button>
      <input class="nav-slider" id="nav-slider" type="range" min="0" max="3" step="1" value="1" aria-label="Slide between tabs" aria-valuetext="Events" />
    </nav>

    <template id="metric-template">
      <article class="metric-card">
        <strong></strong>
        <span></span>
      </article>
    </template>

    <script src="./app.js" type="module"></script>
  </body>
</html>
